name: Build Android App

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'apk'
        type: choice
        options: [apk, aab, both]
      release_tag:
        description: 'Release tag (leave blank to auto-generate, e.g. v1.0.42-run123)'
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to create a GitHub Release and upload assets to it

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Check Flutter
        run: |
          flutter --version
          flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Decode keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/broadcast_my_radio.keystore

      - name: Write key.properties
        run: |
          cat > android/key.properties <<EOF
          storeFile=broadcast_my_radio.keystore
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Show SHA1 Fingerprint
        run: |
          keytool -list -v \
            -keystore android/app/broadcast_my_radio.keystore \
            -alias "${{ secrets.KEY_ALIAS }}" \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}"

      - name: Build Release APK
        if: ${{ github.event.inputs.build_type == 'apk' || github.event.inputs.build_type == 'both' || github.event.inputs.build_type == '' }}
        run: flutter build apk --release

      - name: Build Release AAB
        if: ${{ github.event.inputs.build_type == 'aab' || github.event.inputs.build_type == 'both' }}
        run: flutter build appbundle --release

      - name: Resolve release tag
        id: release_tag
        run: |
          TAG="${{ github.event.inputs.release_tag }}"
          if [ -z "$TAG" ]; then
            TAG="build-${{ github.run_number }}-$(echo ${{ github.sha }} | cut -c1-7)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release with build artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: Broadcast My Radio ${{ steps.release_tag.outputs.tag }}
          # Keep pre-release: builds here aren't vetted store submissions,
          # just CI output. Flip to false for a build you've verified and
          # want to mark as a proper release.
          prerelease: true
          generate_release_notes: true
          # Only globs matching files that were actually built (per the
          # build_type conditionals above) will match anything — a glob with
          # zero matches is silently skipped by this action, so it's safe to
          # list both even when only one was built.
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
