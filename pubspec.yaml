name: broadcast_my_radio
description: "Broadcast My Radio - live radio studio, mic, and audio player for Icecast/Shoutcast broadcasting."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  flutter_riverpod: ^2.5.1

  # Permissions (mic, notifications, battery optimization)
  permission_handler: ^11.3.1

  # File picking for library/cart wall uploads
  file_picker: ^8.0.0

  # Local persistence for settings (server config, cart mappings)
  shared_preferences: ^2.2.3

  # For reading audio file metadata (title/artist tags) for auto now-playing
  audiotags: ^1.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
